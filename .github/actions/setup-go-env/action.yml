name: 'Setup Go Environment'
description: 'Setup Go and install system dependencies like libvips'
inputs:
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.25.5'
  cache:
    description: 'Whether to cache Go modules'
    required: false
    default: 'true'
  install-libvips:
    description: 'Whether to install libvips'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Some local runners (for example act) can drop system paths after setup steps.
    # Re-adding common binary paths keeps Node-based actions available.
    # NOTE: This must run BEFORE setup-go, as GITHUB_PATH prepends directories.
    # Doing this after setup-go would cause system Go binaries (like /usr/bin/go)
    # to shadow the downloaded Go version.
    - name: Ensure node and system binary paths (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "/usr/local/bin" >> "$GITHUB_PATH"
        echo "/usr/bin" >> "$GITHUB_PATH"
        set +e
        ACT_NODE_BIN_DIR="$(ls -d /opt/acttoolcache/node/*/x64/bin 2>/dev/null | sort -V | tail -n 1)"
        set -e
        if [ -n "$ACT_NODE_BIN_DIR" ]; then
          echo "$ACT_NODE_BIN_DIR" >> "$GITHUB_PATH"
        fi

    - name: Set up Go
      uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}

    - name: Install libvips (Linux)
      if: inputs.install-libvips == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips-dev

    - name: Install libvips (macOS)
      if: inputs.install-libvips == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install vips
