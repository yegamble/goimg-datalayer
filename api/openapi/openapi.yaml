openapi: 3.0.3
info:
  title: goimg-datalayer API
  version: 2.0.0
  description: |
    A self-hosted image gallery backend inspired by Flickr and Chevereto.

    Features:
    - User management with JWT authentication
    - Image upload with automatic variant generation
    - Albums, tags, and social features (likes, comments)
    - Content moderation and abuse reporting
    - RESTful API with RFC 7807 error responses

    **Phase 2 Complete**: All Phase 2 features (Sprints 10-15) have been implemented.
    Only advanced tag endpoints remain marked with `x-phase: "3"` for future development.
    These include: popular tags, tag search, tag-based image listing.

  contact:
    name: goimg-datalayer API Team
    url: https://github.com/yegamble/goimg-datalayer
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.goimg.com/v1
    description: Production server (example)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication and authorization endpoints
  - name: users
    description: User profile management
  - name: images
    description: Image upload, retrieval, and management
  - name: albums
    description: Album creation and management
  - name: tags
    description: Tag operations and image tagging
  - name: social
    description: Social features (likes, comments)
  - name: notifications
    description: In-app notifications and alerts
  - name: moderation
    description: Content moderation and abuse reporting
  - name: reports
    description: Abuse report creation and management
  - name: bans
    description: User ban management (admin only)
  - name: nsfw
    description: NSFW content detection and moderation
  - name: explore
    description: Discovery and exploration features
  - name: health
    description: Health check endpoints
  - name: monitoring
    description: Application monitoring and metrics
  - name: oembed
    description: oEmbed protocol for image embedding (Sprint 16)

paths:
  # ==================== Authentication ====================
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Create a new user account with email, username, and password.

        Validation:
        - Email must be unique and not from disposable provider
        - Username must be unique, 3-32 chars, alphanumeric
        - Password must be 12-128 chars with complexity requirements
        - Password is checked against Have I Been Pwned (HIBP) database using k-anonymity
          (only first 5 chars of SHA-1 hash are sent, preserving privacy)

        Security:
        - Compromised passwords (found in data breaches) are rejected
        - HIBP check uses k-anonymity to protect user privacy
        - If HIBP service is unavailable, registration proceeds (fail-open)
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: user@example.com
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  example: johndoe
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  example: MySecureP@ssw0rd123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  username:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: |
            Validation error. Possible error types:
            - `validation-error`: Field validation failed (e.g., password too short)
            - `password-compromised`: Password found in a data breach (HIBP check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                validation_error:
                  summary: Field validation error
                  value:
                    type: https://api.goimg.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: Request validation failed
                    traceId: abc123-def456
                    errors:
                      - field: password
                        message: password must be at least 12 characters
                password_compromised:
                  summary: Password found in data breach
                  value:
                    type: https://api.goimg.com/problems/password-compromised
                    title: Password Compromised
                    status: 400
                    detail: This password has been found in a data breach and cannot be used. Please choose a different password.
                    traceId: abc123-def456
        '409':
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/conflict
                title: Conflict
                status: 409
                detail: Email or username already exists
                traceId: abc123-def456

  /auth/login:
    post:
      tags: [auth]
      summary: User login
      description: |
        Authenticate with email and password to receive JWT tokens.

        Security:
        - Rate limit: 5 attempts per minute per IP
        - Account lockout after 5 failed attempts (15 min)
        - Generic error messages to prevent account enumeration
        - Random response delay (100-300ms) to prevent timing attacks
        - Constant-time password comparison (Argon2id)
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: MySecureP@ssw0rd123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Invalid email or password
                traceId: abc123-def456
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: |
        Exchange a refresh token for a new access token and refresh token.

        Security:
        - Refresh token rotation (old token invalidated)
        - Replay attack detection (token reuse revokes entire family)
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/logout:
    post:
      tags: [auth]
      summary: User logout
      description: Invalidate the current refresh token
      operationId: logoutUser
      responses:
        '204':
          description: Logout successful
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==================== Two-Factor Authentication ====================
  /auth/2fa/setup:
    post:
      tags: [auth]
      summary: Setup 2FA
      description: |
        Initiate two-factor authentication setup for the authenticated user.

        This endpoint generates:
        - A TOTP secret for use with authenticator apps (Google Authenticator, Authy, etc.)
        - A provisioning URI for QR code generation
        - 10 one-time backup codes for account recovery

        Security:
        - Requires authentication
        - Returns secret and backup codes only once - user must save them
        - 2FA is not active until verified with /auth/2fa/verify
        - Backup codes are hashed before storage (bcrypt)
        - TOTP secret is encrypted at rest (AES-256-GCM)
      operationId: setup2FA
      responses:
        '200':
          description: 2FA setup initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup2FAResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/conflict
                title: Conflict
                status: 409
                detail: Two-factor authentication is already enabled
                traceId: abc123-def456

  /auth/2fa/verify:
    post:
      tags: [auth]
      summary: Verify and enable 2FA
      description: |
        Verify the TOTP code and enable two-factor authentication.

        This must be called after /auth/2fa/setup with a valid 6-digit code
        from the user's authenticator app.

        Security:
        - Code validation uses constant-time comparison
        - Allows 1 time-step skew (±30 seconds)
        - Once verified, 2FA is required for all future logins
      operationId: verify2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 6-digit TOTP code from authenticator app
                  example: "123456"
      responses:
        '200':
          description: 2FA enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication has been enabled successfully
        '400':
          description: Invalid verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/bad-request
                title: Bad Request
                status: 400
                detail: Invalid verification code
                traceId: abc123-def456
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No pending 2FA setup found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/2fa/disable:
    post:
      tags: [auth]
      summary: Disable 2FA
      description: |
        Disable two-factor authentication for the authenticated user.

        Security:
        - Requires password confirmation
        - Optionally accepts TOTP code for additional verification
        - Deletes TOTP secret and all backup codes
        - Publishes audit event for security logging
      operationId: disable2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: Current account password for confirmation
                  example: MySecureP@ssw0rd123
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Optional 6-digit TOTP code for extra security
                  example: "123456"
      responses:
        '200':
          description: 2FA disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication has been disabled
        '400':
          description: Invalid request or TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 2FA not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/2fa/status:
    get:
      tags: [auth]
      summary: Get 2FA status
      description: |
        Retrieve the current two-factor authentication status for the authenticated user.

        Returns:
        - Whether 2FA is enabled
        - Whether setup is pending verification
        - Number of unused backup codes remaining
        - When 2FA was enabled (if applicable)
      operationId: get2FAStatus
      responses:
        '200':
          description: 2FA status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/2fa/backup-codes/regenerate:
    post:
      tags: [auth]
      summary: Regenerate backup codes
      description: |
        Generate new backup codes, invalidating all existing ones.

        Security:
        - Requires password confirmation
        - 2FA must be enabled
        - Old backup codes are deleted before generating new ones
        - Returns 10 new one-time codes
        - Codes are shown only once - user must save them
      operationId: regenerateBackupCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: Current account password for confirmation
                  example: MySecureP@ssw0rd123
      responses:
        '200':
          description: Backup codes regenerated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 2FA not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/2fa/login-verify:
    post:
      tags: [auth]
      summary: Verify 2FA during login
      description: |
        Verify TOTP code during login for session elevation.

        When a user with 2FA enabled logs in, they receive a non-elevated token.
        This endpoint verifies the TOTP code and returns an elevated access token
        with the `2fa_verified` claim set to true.

        Security:
        - Requires authentication (non-elevated JWT token)
        - Rate limit: 5 attempts per minute
        - TOTP code must be from registered authenticator app
        - Returns elevated token on success
      operationId: verify2FALogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: '^\d{6}$'
                  description: 6-digit TOTP code from authenticator app
                  example: "123456"
      responses:
        '200':
          description: 2FA verification successful, returns elevated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or expired TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized - no valid token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: 2FA not enabled for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many attempts - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==================== OAuth 2.0 ====================
  /auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: Initiate OAuth flow
      description: |
        Redirect to OAuth provider authorization page.

        Supported providers:
        - google: Google OAuth 2.0
        - github: GitHub OAuth

        This endpoint redirects the user to the OAuth provider's authorization page.
        After user consent, the provider redirects back to the callback endpoint.

        Security:
        - State parameter is generated and validated to prevent CSRF attacks
        - PKCE (Proof Key for Code Exchange) is used for enhanced security
      operationId: initiateOAuthFlow
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider name
          schema:
            type: string
            enum: [google, github]
          example: google
      responses:
        '302':
          description: Redirect to OAuth provider
          headers:
            Location:
              description: OAuth provider authorization URL
              schema:
                type: string
                format: uri
                example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
        '400':
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/bad-request
                title: Bad Request
                status: 400
                detail: Invalid OAuth provider
                traceId: abc123-def456
    delete:
      tags: [auth]
      summary: Unlink OAuth account by provider
      description: |
        Remove the link between an OAuth provider and the authenticated user's account.

        After unlinking, the user will no longer be able to login using that OAuth provider.
        They must have at least one other login method (password or another OAuth provider).
      operationId: unlinkOAuthAccountByProvider
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider to unlink
          schema:
            type: string
            enum: [google, github]
          example: google
      responses:
        '200':
          description: OAuth account unlinked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OAuth account unlinked successfully
        '400':
          description: Bad request - cannot unlink (e.g., only login method)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: OAuth account not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: Handle OAuth callback
      description: |
        Handle OAuth provider callback after user authorization.

        This endpoint receives the authorization code from the OAuth provider,
        exchanges it for an access token, and either:
        - Creates a new user account (if email doesn't exist)
        - Logs in existing user (if OAuth account is linked)
        - Returns error if account exists but OAuth is not linked

        Security:
        - Validates state parameter to prevent CSRF
        - Verifies PKCE code verifier
        - Token exchange happens server-side
      operationId: handleOAuthCallback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider name
          schema:
            type: string
            enum: [google, github]
          example: google
        - name: code
          in: query
          required: true
          description: Authorization code from OAuth provider
          schema:
            type: string
          example: 4/0AfJohXm...
        - name: state
          in: query
          required: true
          description: CSRF protection state parameter
          schema:
            type: string
          example: abc123def456
        - name: error
          in: query
          description: Error code from OAuth provider (if authorization failed)
          schema:
            type: string
          example: access_denied
        - name: error_description
          in: query
          description: Error description from OAuth provider
          schema:
            type: string
          example: User denied access
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            OAuth error. Possible error types:
            - `invalid-state`: State parameter mismatch (CSRF attack)
            - `invalid-code`: Authorization code invalid or expired
            - `oauth-error`: Provider returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalid_state:
                  summary: Invalid state parameter
                  value:
                    type: https://api.goimg.com/problems/invalid-state
                    title: Invalid State
                    status: 400
                    detail: State parameter validation failed
                    traceId: abc123-def456
                oauth_error:
                  summary: OAuth provider error
                  value:
                    type: https://api.goimg.com/problems/oauth-error
                    title: OAuth Error
                    status: 400
                    detail: User denied access
                    traceId: abc123-def456
        '401':
          description: OAuth authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: OAuth authentication failed
                traceId: abc123-def456
        '409':
          description: Email already registered with different authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/conflict
                title: Conflict
                status: 409
                detail: An account with this email already exists. Please use password login or link your OAuth account.
                traceId: abc123-def456

  /auth/oauth/link:
    post:
      tags: [auth]
      summary: Link OAuth account
      description: |
        Link an OAuth provider account to the authenticated user.

        This allows users to add OAuth login methods to their existing account.
        The OAuth account's email must match the user's account email.

        Process:
        1. User initiates OAuth flow on frontend
        2. After OAuth provider authorization, frontend receives code and state
        3. Frontend sends code and state to this endpoint
        4. Server exchanges code for OAuth account info and links to user

        Security:
        - Requires JWT authentication
        - Validates state parameter
        - Email must match authenticated user's email
      operationId: linkOAuthAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code, state]
              properties:
                provider:
                  type: string
                  enum: [google, github]
                  example: google
                code:
                  type: string
                  description: Authorization code from OAuth provider
                  example: 4/0AfJohXm...
                state:
                  type: string
                  description: CSRF protection state parameter
                  example: abc123def456
      responses:
        '200':
          description: OAuth account linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccount'
        '400':
          description: |
            Validation error. Possible error types:
            - `invalid-state`: State parameter mismatch
            - `email-mismatch`: OAuth email doesn't match user's email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                email_mismatch:
                  summary: Email mismatch
                  value:
                    type: https://api.goimg.com/problems/email-mismatch
                    title: Email Mismatch
                    status: 400
                    detail: OAuth account email does not match your account email
                    traceId: abc123-def456
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: OAuth account already linked to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/conflict
                title: Conflict
                status: 409
                detail: This OAuth account is already linked to another user
                traceId: abc123-def456

    delete:
      tags: [auth]
      summary: Unlink OAuth account
      description: |
        Remove OAuth provider link from the authenticated user.

        Security:
        - Users cannot unlink their only authentication method
        - Must have either password or another OAuth provider linked
      operationId: unlinkOAuthAccount
      parameters:
        - name: provider
          in: query
          required: true
          description: OAuth provider to unlink
          schema:
            type: string
            enum: [google, github]
          example: google
      responses:
        '204':
          description: OAuth account unlinked successfully
        '400':
          description: Cannot unlink only authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/bad-request
                title: Bad Request
                status: 400
                detail: Cannot unlink your only authentication method. Add a password or another OAuth provider first.
                traceId: abc123-def456
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: OAuth provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/not-found
                title: Not Found
                status: 404
                detail: OAuth provider not linked to your account
                traceId: abc123-def456

  /auth/oauth/accounts:
    get:
      tags: [auth]
      summary: List linked OAuth accounts
      description: |
        Retrieve list of OAuth providers linked to the authenticated user.

        Returns information about connected OAuth accounts including:
        - Provider name (google, github)
        - Provider user ID
        - Email used for OAuth
        - Display name from provider
        - When the account was linked
      operationId: listLinkedOAuthAccounts
      responses:
        '200':
          description: OAuth accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthAccount'
                  total_count:
