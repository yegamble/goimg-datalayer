        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}/likes:
    get:
      tags: [users]
      summary: Get user's liked images
      description: |
        Retrieve a paginated list of images that the specified user has liked.

        Access control:
        - Public users: Can view likes of users with public profiles
        - Authenticated users: Can view their own likes and public likes
      operationId: getUserLikedImages
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Liked images retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Image'
        '401':
          description: Unauthorized (optional - only if authentication required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==================== User Follow/Unfollow ====================
  /users/{id}/follow:
    post:
      tags: [users]
      summary: Follow user
      description: |
        Follow another user to receive updates about their activity.

        Business rules:
        - Cannot follow yourself
        - Cannot follow the same user twice
        - Cannot follow inactive users (suspended/deleted)

        This operation is idempotent - following a user you already follow returns 409 Conflict.
      operationId: followUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User followed successfully
        '400':
          description: |
            Validation error. Possible error types:
            - Invalid user ID format
            - Cannot follow yourself
            - Cannot follow inactive user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                cannot_follow_self:
                  summary: Cannot follow yourself
                  value:
                    type: https://api.goimg.com/problems/bad-request
                    title: Bad Request
                    status: 400
                    detail: Cannot follow yourself
                    traceId: abc123-def456
                inactive_user:
                  summary: Cannot follow inactive user
                  value:
                    type: https://api.goimg.com/problems/bad-request
                    title: Bad Request
                    status: 400
                    detail: Cannot follow inactive user
                    traceId: abc123-def456
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/not-found
                title: Not Found
                status: 404
                detail: User not found
                traceId: abc123-def456
        '409':
          description: Already following this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://api.goimg.com/problems/conflict
                title: Conflict
                status: 409
                detail: You are already following this user
                traceId: abc123-def456

    delete:
      tags: [users]
      summary: Unfollow user
      description: |
        Unfollow a user to stop receiving updates about their activity.

        This operation is idempotent - unfollowing a user you don't follow succeeds without error.
        This prevents client-side retry issues and simplifies error handling.
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User unfollowed successfully (or was not following)
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}/followers:
    get:
      tags: [users]
      summary: List user followers
      description: |
        Retrieve a paginated list of users who are following the specified user.

        Returns user profile information for each follower including:
        - User ID, username, display name
        - Bio (if set)
        - When they started following (followed_at timestamp)

        This endpoint is public - anyone can view a user's followers.
      operationId: getUserFollowers
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: limit
          in: query
          description: Maximum number of followers to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          description: Number of followers to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Followers list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowersList'
        '400':
          description: Invalid user ID or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}/following:
    get:
      tags: [users]
      summary: List users being followed
      description: |
        Retrieve a paginated list of users that the specified user is following.

        Returns user profile information for each followed user including:
        - User ID, username, display name
        - Bio (if set)
        - When follow started (followed_at timestamp)

        This endpoint is public - anyone can view who a user is following.
      operationId: getUserFollowing
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: limit
          in: query
          description: Maximum number of followed users to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          description: Number of followed users to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Following list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowingList'
        '400':
          description: Invalid user ID or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /feed:
    get:
      tags: [social]
      summary: Get activity feed
      description: |
        Retrieve a paginated feed of activities from users that the authenticated user follows.

        Returns activities including:
        - Image uploads, likes, and comments
        - User follows
        - Album creations

        Activities are sorted by creation time (most recent first) and include metadata
        for displaying activity details in the UI.

        This endpoint requires authentication - only the authenticated user can view their own feed.
      operationId: getActivityFeed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of activities to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          description: Number of activities to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Activity feed retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeed'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==================== Notifications ====================
  /notifications:
    get:
      tags: [notifications]
      summary: Get notifications
      description: |
        Retrieve a paginated list of notifications for the authenticated user.

        Notifications include:
        - New followers
        - New photos from followed users
        - Account status changes (suspended, banned, reinstated)
        - Admin/moderator alerts (for admin users)

        Notifications are sorted by creation time (most recent first) and include
        a read/unread status for badge display in UI.

        This endpoint requires authentication - users can only view their own notifications.
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread_only
          in: query
          description: If true, only return unread notifications
          schema:
            type: boolean
            default: false
          example: false
        - name: limit
          in: query
          description: Maximum number of notifications to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          description: Number of notifications to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsList'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /notifications/count:
    get:
      tags: [notifications]
      summary: Get unread notification count
      description: |
        Retrieve the count of unread notifications for the authenticated user.

        This endpoint is lightweight and designed for polling to update
        notification badges in the UI. Returns only the count, not the
        notification details.

        This endpoint requires authentication - users can only view their own count.
      operationId: getUnreadNotificationCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /notifications/read:
    post:
      tags: [notifications]
      summary: Mark notifications as read
      description: |
        Mark one or more notifications as read for the authenticated user.

        This endpoint supports two modes:
        1. Mark specific notifications by ID (provide notificationIds array)
        2. Mark all notifications as read (set markAllAsRead to true)

        Marking already-read notifications is idempotent and will succeed.

        Authorization: Users can only mark their own notifications as read.
        Attempting to mark another user's notifications returns 403 Forbidden.
      operationId: markNotificationsAsRead
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds:
                  type: array
                  description: Array of notification IDs to mark as read (optional)
                  items:
                    type: string
                    format: uuid
                  example: ["123e4567-e89b-12d3-a456-426614174001", "123e4567-e89b-12d3-a456-426614174002"]
                markAllAsRead:
                  type: boolean
                  description: If true, mark all notifications for user as read (optional)
                  default: false
                  example: false
              anyOf:
                - required: [notificationIds]
                - required: [markAllAsRead]
      responses:
        '204':
          description: Notifications marked as read successfully
        '400':
          description: Invalid request body (neither notificationIds nor markAllAsRead provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - notification does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==================== Images ====================
  /images:
    post:
      tags: [images]
      summary: Upload image
      description: |
        Upload a new image with optional metadata.

        Processing:
        - ClamAV malware scan (required)
        - EXIF metadata extraction
        - EXIF stripping (GPS data removed by default)
        - Generate 4 variants: thumbnail (150px), small (320px), medium (800px), large (1600px)
        - Store original
        - Re-encode through libvips for security

        Rate limit: 50 uploads per hour per user
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, GIF, WebP)
                title:
                  type: string
                  maxLength: 255
                  example: Sunset over mountains
                description:
                  type: string
                  maxLength: 2000
                  example: Beautiful sunset captured in Rocky Mountains
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                  default: private
                album_id:
                  type: string
                  format: uuid
                  description: Add image to album (optional)
                tags:
                  type: string
                  description: Comma-separated tags (max 20)
                  example: sunset,mountains,nature,landscape
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: File too large (max 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Malware detected or processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Upload rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags: [images]
      summary: List images
      description: |
        List images with optional filtering and pagination.

        Returns only images the authenticated user has permission to view:
        - Own images (all visibility levels)
        - Public images from other users
      operationId: listImages
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: query
          description: Filter by image owner
          schema:
            type: string
            format: uuid
        - name: album_id
          in: query
          description: Filter by album
          schema:
            type: string
            format: uuid
        - name: visibility
          in: query
          description: Filter by visibility (only for own images)
          schema:
            type: string
            enum: [public, private, unlisted]
        - name: tags
          in: query
          description: Filter by tags (comma-separated, AND logic)
          schema:
            type: string
            example: sunset,nature
        - name: q
          in: query
          description: Search query (title, description)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [created_at, view_count, like_count]
            default: created_at
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Images retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Image'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /images/{id}:
    get:
      tags: [images]
      summary: Get image details
      description: Retrieve detailed information about a specific image
      operationId: getImage
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      responses:
        '200':
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '404':
          description: Image not found or not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [images]
      summary: Update image metadata
      description: |
        Update image metadata. Only the image owner can update their images.
        Admins can update any image.
      operationId: updateImage
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                tags:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                  example: [sunset, mountains, nature]
      responses:
        '200':
          description: Image updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - cannot update another user's image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [images]
      summary: Delete image
      description: |
        Delete an image permanently. Only the image owner can delete their images.
        Moderators and admins can delete any image.
      operationId: deleteImage
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      responses:
        '204':
          description: Image deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - cannot delete another user's image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /images/{id}/variants/{size}:
    get:
      tags: [images]
      summary: Get image variant
      description: |
        Retrieve a specific image variant (resized version).

        Available sizes:
        - thumbnail: 160px max width (WebP, quality 82)
        - small: 320px max width (WebP, quality 85)
        - medium: 800px max width (WebP, quality 85)
        - large: 1600px max width (WebP, quality 88)
        - original: unchanged dimensions (original format, quality 100 - maximum quality with security re-encoding)

        Aspect ratio is preserved (contain, not crop).
      operationId: getImageVariant
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
        - name: size
          in: path
          required: true
          description: Variant size
          schema:
            type: string
            enum: [thumbnail, small, medium, large, original]
      responses:
        '200':
          description: Image variant retrieved successfully
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Image or variant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /images/{id}/ipfs:
    get:
      tags: [images]
      summary: Get image IPFS status
      description: |
        Retrieve the IPFS (InterPlanetary File System) status for an image.
        Returns the CID, pin status, and gateway URLs if the image is on IPFS.

        Authorization:
        - Image owners can always view IPFS status
        - Public images allow anyone to view IPFS status
        - Private images require owner authentication
      operationId: getImageIPFSStatus
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      responses:
        '200':
          description: IPFS status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageIPFSStatus'
        '401':
          description: Unauthorized - private image requires authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - cannot view private image's IPFS status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags: [images]
      summary: Pin image to IPFS
      description: |
        Pin an image to IPFS for decentralized storage.
        Creates an immutable backup of the image content on the IPFS network.

        The image is uploaded to the configured IPFS node and pinned to prevent
        garbage collection. The CID (Content Identifier) is stored in the database.

        Authorization:
        - Only the image owner can pin their images to IPFS
        - Image must not already be pinned

        Returns:
        - CID: The IPFS Content Identifier (unique hash of the content)
        - Gateway URL: Public URL to access the content via IPFS gateway
      operationId: pinImageToIPFS
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      responses:
        '201':
          description: Image pinned to IPFS successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinImageToIPFSResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - cannot pin another user's image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Conflict - image already pinned to IPFS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error - IPFS upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [images]
      summary: Unpin image from IPFS
      description: |
        Remove an image from IPFS storage.
        The image remains in primary storage; only the IPFS backup is removed.

        Note: Unpinned content may still be available on IPFS if other nodes
        have pinned it. The content becomes eligible for garbage collection
        on the local node.

        Authorization:
        - Only the image owner can unpin their images from IPFS
        - Image must be currently pinned
      operationId: unpinImageFromIPFS
      parameters:
        - $ref: '#/components/parameters/ImageIdParam'
      responses:
        '200':
          description: Image unpinned from IPFS successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpinImageFromIPFSResponse'
        '400':
          description: Bad Request - image is not pinned to IPFS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - cannot unpin another user's image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error - IPFS unpin failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

