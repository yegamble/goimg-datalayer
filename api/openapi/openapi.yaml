    # ==================== NSFW Detection ====================
    NSFWScan:
      type: object
      required: [id, image_id, provider, status, created_at, updated_at]
      description: NSFW scan result for an image
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the scan
          example: 123e4567-e89b-12d3-a456-426614174000
        image_id:
          type: string
          format: uuid
          description: ID of the scanned image
          example: 123e4567-e89b-12d3-a456-426614174001
        provider:
          type: string
          enum: [sightengine, moderatecontent, mock]
          description: NSFW detection provider used
          example: sightengine
        status:
          type: string
          enum: [pending, scanning, completed, failed]
          description: Current status of the scan
          example: completed
        category:
          type: string
          enum: [safe, suggestive, nudity, explicit, violence, weapons, drugs, offensive, unknown]
          description: Primary NSFW category detected
          example: safe
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence score for NSFW detection (0 = safe, 1 = definite NSFW)
          example: 0.05
        is_nsfw:
          type: boolean
          description: Whether the image is flagged as NSFW
          example: false
        requires_review:
          type: boolean
          description: Whether the scan result requires manual review
          example: false
        details:
          $ref: '#/components/schemas/NSFWScanDetails'
        error_message:
          type: string
          nullable: true
          description: Error message if the scan failed
          example: null
        scanned_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the scan completed
          example: 2024-01-15T10:30:05Z
        created_at:
          type: string
          format: date-time
          description: Timestamp when the scan was created
          example: 2024-01-15T10:30:00Z
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the scan was last updated
          example: 2024-01-15T10:30:05Z

    NSFWScanDetails:
      type: object
      nullable: true
      description: Detailed category scores from NSFW detection
      properties:
        nudity_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Score for nudity detection
          example: 0.02
        weapon_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Score for weapon detection
          example: 0.01
        violence_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Score for violence detection
          example: 0.01
        offensive_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Score for offensive content detection
          example: 0.05
        drug_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Score for drug-related content detection
          example: 0.00
        sub_categories:
          type: array
          items:
            type: string
          description: Detected sub-categories
          example: []

    NSFWScanResponse:
      type: object
      required: [scan_id, status, is_nsfw, provider]
      description: Response after initiating an NSFW scan
      properties:
        scan_id:
          type: string
          format: uuid
          description: Unique identifier for the scan
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum: [pending, scanning, completed, failed]
          description: Current status of the scan
          example: completed
        category:
          type: string
          enum: [safe, suggestive, nudity, explicit, violence, weapons, drugs, offensive, unknown]
          description: Primary NSFW category detected
          example: safe
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence score
          example: 0.05
        is_nsfw:
          type: boolean
          description: Whether the image is flagged as NSFW
          example: false
        requires_review:
          type: boolean
          description: Whether the scan result requires manual review
          example: false
        provider:
          type: string
          description: Provider used for the scan
          example: sightengine

