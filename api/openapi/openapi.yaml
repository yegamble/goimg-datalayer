# ==================== Components ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer authentication. Include the access token in the Authorization header:

        ```
        Authorization: Bearer <access_token>
        ```

        Access tokens expire after 15 minutes. Use the refresh endpoint to obtain a new token.

  parameters:
    UserIdParam:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000

    ImageIdParam:
      name: id
      in: path
      required: true
      description: Image ID
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000

    AlbumIdParam:
      name: id
      in: path
      required: true
      description: Album ID
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000

    PageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  schemas:
    # ==================== Core Entities ====================
    User:
      type: object
      required: [id, email, username, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        display_name:
          type: string
          nullable: true
          example: John Doe
        bio:
          type: string
          nullable: true
          example: Photographer and nature enthusiast
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.goimg.com/avatars/123e4567.jpg
        image_count:
          type: integer
          description: Number of public images
          example: 42
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z

    Image:
      type: object
      required: [id, owner_id, owner, visibility, mime_type, width, height, variants, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        owner_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
        owner:
