          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [users]
      summary: Update user profile
      description: |
        Update own user profile. Users can only update their own profile.

        Updatable fields:
        - display_name
        - bio
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
