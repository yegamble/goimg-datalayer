  # ==================== NSFW Detection ====================
  /moderation/nsfw/scan:
    post:
      tags: [nsfw]
      summary: Initiate NSFW scan
      description: |
        Initiate an NSFW scan for an image. The scan is performed
        using configured NSFW detection providers (SightEngine,
        ModerateContent, or mock for testing).

        Requires moderator or admin role.

        The scan is executed synchronously and returns the result.
        Use the `force` parameter to rescan an image that has
        already been scanned.
      operationId: scanImageNSFW
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id]
              properties:
                image_id:
                  type: string
                  format: uuid
                  description: UUID of the image to scan
                force:
                  type: boolean
                  default: false
                  description: Force rescan even if active scan exists
      responses:
        '201':
          description: NSFW scan completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSFWScanResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - requires moderator or admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Active scan already exists (use force=true to override)
