    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    ClaimGuestImageResponse:
      type: object
      required: [image_id, new_owner_id, previous_owner, transferred_at, message]
      description: Response from successfully claiming a guest upload
      properties:
        image_id:
          type: string
          format: uuid
          description: The ID of the claimed image
          example: 123e4567-e89b-12d3-a456-426614174000
        new_owner_id:
          type: string
          format: uuid
          description: The ID of the new owner (authenticated user)
          example: 456e4567-e89b-12d3-a456-426614174001
        previous_owner:
          type: string
          format: uuid
          description: The ID of the previous owner (guest user)
          example: 789e4567-e89b-12d3-a456-426614174002
        transferred_at:
          type: string
          format: date-time
          description: When the ownership was transferred
          example: "2026-01-08T14:30:00Z"
        message:
          type: string
          description: Success message
          example: Image claimed successfully

    # ==================== Two-Factor Authentication ====================
    Setup2FAResponse:
      type: object
      required: [secret, provisioning_uri, issuer, account_name, backup_codes]
      description: Response from 2FA setup containing secret and backup codes
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret for manual entry into authenticator
          example: JBSWY3DPEHPK3PXP
        provisioning_uri:
          type: string
          format: uri
          description: otpauth:// URI for QR code generation
          example: otpauth://totp/goimg:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=goimg
        issuer:
          type: string
          description: Application name shown in authenticator apps
          example: goimg
        account_name:
          type: string
          description: Account identifier (usually email)
          example: user@example.com
        backup_codes:
          type: array
          description: One-time recovery codes (10 codes, shown only once)
          items:
            type: string
          minItems: 10
          maxItems: 10
          example:
            - "A1B2C3D4"
            - "E5F6G7H8"
            - "I9J0K1L2"
            - "M3N4O5P6"
            - "Q7R8S9T0"
            - "U1V2W3X4"
            - "Y5Z6A7B8"
            - "C9D0E1F2"
            - "G3H4I5J6"
            - "K7L8M9N0"

    TwoFactorStatus:
      type: object
      required: [enabled, setup_pending, backup_codes_remaining]
      description: Current 2FA status for a user
      properties:
        enabled:
          type: boolean
          description: Whether 2FA is currently active
          example: true
        setup_pending:
          type: boolean
          description: Whether 2FA setup was started but not yet verified
          example: false
        backup_codes_remaining:
          type: integer
          description: Number of unused backup codes remaining
          minimum: 0
          maximum: 10
          example: 8
        enabled_at:
          type: string
          format: date-time
          description: When 2FA was enabled (null if not enabled)
          nullable: true
          example: 2024-01-15T10:30:00Z

    BackupCodesResponse:
      type: object
      required: [backup_codes, remaining_codes]
      description: Response containing newly generated backup codes
      properties:
        backup_codes:
          type: array
          description: New one-time recovery codes (shown only once)
          items:
            type: string
          minItems: 10
          maxItems: 10
          example:
            - "A1B2C3D4"
            - "E5F6G7H8"
            - "I9J0K1L2"
            - "M3N4O5P6"
            - "Q7R8S9T0"
            - "U1V2W3X4"
            - "Y5Z6A7B8"
            - "C9D0E1F2"
            - "G3H4I5J6"
            - "K7L8M9N0"
        remaining_codes:
          type: integer
          description: Number of unused backup codes (always 10 after regeneration)
          example: 10

    # ==================== OAuth 2.0 ====================
    OAuthAccount:
      type: object
      required: [provider, provider_user_id, email, linked_at]
      description: OAuth account linked to a user
      properties:
        provider:
          type: string
          enum: [google, github]
          description: OAuth provider name
          example: google
        provider_user_id:
          type: string
          description: Unique user ID from the OAuth provider
          example: "103547991597142817347"
        email:
          type: string
          format: email
          description: Email address from the OAuth provider
          example: user@example.com
        display_name:
          type: string
          description: Display name from the OAuth provider
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          description: Profile picture URL from the OAuth provider
          nullable: true
          example: https://lh3.googleusercontent.com/a/...
        linked_at:
          type: string
          format: date-time
          description: When the OAuth account was linked to the user
          example: 2024-01-15T10:30:00Z

    # ==================== Pagination ====================
    PaginatedResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [total, page, per_page, total_pages]
      properties:
        total:
          type: integer
          description: Total number of items
          example: 150
        page:
          type: integer
          description: Current page number
          example: 1
        per_page:
          type: integer
          description: Items per page
          example: 20
        total_pages:
          type: integer
          description: Total number of pages
          example: 8

    # ==================== Error Responses (RFC 7807) ====================
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: https://api.goimg.com/problems/validation-error
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Validation Error
        status:
          type: integer
          description: The HTTP status code
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
          example: Request validation failed
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence
          example: /api/v1/images
        traceId:
          type: string
          description: A unique identifier for tracing the request
          example: abc123-def456
        errors:
          type: array
          description: Detailed validation errors (for 400 responses)
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: must not exceed 255 characters

    # ==================== Session ====================
    Session:
      type: object
      required: [id, user_id, created_at, expires_at]
      description: User session information
      properties:
        id:
          type: string
          format: uuid
          description: Session ID
          example: 123e4567-e89b-12d3-a456-426614174000
        user_id:
          type: string
          format: uuid
          description: User ID
          example: 123e4567-e89b-12d3-a456-426614174001
        ip_address:
          type: string
          description: IP address of the session
          example: 192.168.1.1
        user_agent:
          type: string
          description: Browser/device user agent
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        created_at:
          type: string
          format: date-time
          description: Session creation time
          example: 2024-01-15T10:30:00Z
        expires_at:
          type: string
          format: date-time
          description: Session expiration time
          example: 2024-01-22T10:30:00Z
        is_current:
          type: boolean
          description: Whether this is the current session
          example: true

    # ==================== Notifications ====================
    NotificationsList:
      type: object
      required: [notifications, totalUnread, offset, limit]
      description: Paginated list of notifications with unread count
      properties:
        notifications:
          type: array
          description: List of notifications for the user
          items:
            $ref: '#/components/schemas/Notification'
        totalUnread:
          type: integer
          description: Total number of unread notifications
          minimum: 0
          example: 5
        offset:
          type: integer
          description: Number of notifications skipped for pagination
          minimum: 0
          example: 0
        limit:
          type: integer
          description: Maximum number of notifications returned
          minimum: 1
          maximum: 100
          example: 20
      example:
        notifications:
          - id: 123e4567-e89b-12d3-a456-426614174001
            type: new_follower
            title: johndoe started following you
            body: johndoe is now following you. View their profile to see their photos.
            metadata:
              follower_id: 123e4567-e89b-12d3-a456-426614174002
              follower_username: johndoe
            isRead: false
            createdAt: 2024-01-15T14:20:00Z
            readAt: null
          - id: 123e4567-e89b-12d3-a456-426614174003
            type: new_photos
            title: 5 new photos from users you follow
            body: Check out the latest photos from your network.
            metadata:
              photo_count: "5"
            isRead: true
            createdAt: 2024-01-15T10:15:00Z
            readAt: 2024-01-15T11:30:00Z
        totalUnread: 5
        offset: 0
        limit: 20

    Notification:
      type: object
      required: [id, type, title, body, metadata, isRead, createdAt]
      description: A single notification for a user
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the notification
          example: 123e4567-e89b-12d3-a456-426614174001
        type:
          type: string
          enum: [new_follower, new_photos, account_suspended, account_banned, account_reinstated, abuse_report, report_escalated, mod_action_required]
          description: Type of notification
          example: new_follower
        title:
          type: string
          maxLength: 255
          description: Notification title (short summary)
          example: johndoe started following you
        body:
          type: string
          description: Notification body (detailed message)
          example: johndoe is now following you. View their profile to see their photos.
        metadata:
          type: object
          description: Flexible JSON payload for notification-specific data
          additionalProperties:
            type: string
          example:
            follower_id: 123e4567-e89b-12d3-a456-426614174002
            follower_username: johndoe
        isRead:
          type: boolean
          description: Whether the notification has been read
          example: false
        createdAt:
          type: string
          format: date-time
          description: When the notification was created
          example: 2024-01-15T14:20:00Z
        readAt:
          type: string
          format: date-time
          description: When the notification was marked as read (null if unread)
          nullable: true
          example: null

    UnreadCount:
      type: object
      required: [count]
      description: Count of unread notifications for badge display
      properties:
        count:
          type: integer
          description: Number of unread notifications
          minimum: 0
          example: 5
      example:
        count: 5

    # ==================== oEmbed (Sprint 16) ====================
    OEmbedResponse:
      type: object
      description: |
        oEmbed 1.0 response for photo type.
        See https://oembed.com/#section2.3.4.1
      required:
        - type
        - version
        - url
        - width
        - height
      properties:
        type:
          type: string
          description: Resource type (always "photo" for images)
          enum: [photo]
          example: photo
        version:
          type: string
          description: oEmbed version (always "1.0")
          enum: ["1.0"]
          example: "1.0"
        url:
          type: string
          format: uri
          description: URL of the image
          example: https://example.com/api/v1/images/123/variants/large
        width:
          type: integer
          description: Width of image in pixels
          example: 1600
        height:
          type: integer
          description: Height of image in pixels
          example: 1200
        title:
          type: string
          description: Image title
          example: Beautiful sunset
        author_name:
          type: string
          description: Username of image owner
          example: johndoe
        author_url:
          type: string
          format: uri
          description: URL to author's profile
          example: https://example.com/users/456
        provider_name:
          type: string
          description: Name of the provider (goimg)
          example: goimg
        provider_url:
          type: string
          format: uri
          description: URL to the provider
          example: https://example.com
        cache_age:
          type: integer
          description: Suggested cache duration in seconds
          example: 3600
        thumbnail_url:
          type: string
          format: uri
          description: URL of the thumbnail image
          example: https://example.com/api/v1/images/123/variants/thumbnail
        thumbnail_width:
          type: integer
          description: Width of thumbnail in pixels
          example: 150
        thumbnail_height:
          type: integer
          description: Height of thumbnail in pixels
          example: 112

    # ==================== Health ====================
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z

    HealthReadyResponse:
      type: object
      required: [status, timestamp, checks]
      description: Readiness check response with dependency health status
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: ready
        timestamp:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
        checks:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
            redis:
              $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      description: Individual dependency health check result
      properties:
        status:
          type: string
          enum: [up, down]
          example: up
        latency_ms:
          type: number
          format: float
          description: Response time in milliseconds
          example: 5.2
        error:
          type: string
          description: Error message if check failed
          example: connection refused
